<text class="l2" x="54.00" y="155.55"></text>
<text class="l3" x="54.00" y="174.40"><tspan fill="#111111" font-weight="700">Market</tspan><tspan fill="#111111" fill-opacity="0.62">   * merging parties</tspan></text>
