<text class="l12" x="54.00" y="344.05"><tspan fill="#111111" font-weight="700">Rule set                              </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">Reading    </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">Reference  </tspan></text>
<text class="l13" x="54.00" y="362.90"><tspan fill="#111111">──────────────────────────────────────────────────────────────────</tspan></text>
<text class="l14" x="54.00" y="381.75"><tspan fill="#111111">U.S. Merger Guidelines 2023              </tspan><tspan fill="#c8102e">presumption</tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">Guideline 1</tspan></text>
<text class="l15" x="54.00" y="400.60"><tspan fill="#111111">U.S. Horizontal Merger Guidelines 2010   </tspan><tspan fill="#c8102e">presumption</tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">section 5.3</tspan></text>
<text class="l16" x="54.00" y="419.45"><tspan fill="#111111">EU Horizontal Merger Guidelines 2004     </tspan><tspan fill="#9a6700">scrutiny   </tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">paras 17-21</tspan></text>
