<text class="l24" x="54.00" y="570.25"><tspan fill="#111111">Linear                     +3.7%       +4.0%   </tspan><tspan fill="#111111" font-weight="700">  +3.9%</tspan><tspan fill="#111111">       3.8% [1.9, 6.9]    8.0%      $17.4m          $21.5m</tspan></text>
<text class="l25" x="54.00" y="589.10"><tspan fill="#111111">PCAIDS                     +4.1%       +4.4%   </tspan><tspan fill="#111111" font-weight="700">  +4.2%</tspan><tspan fill="#111111">       4.1% [2.6, 6.5]    5.9%      $12.8m          $20.1m</tspan></text>
<text class="l26" x="54.00" y="607.95"><tspan fill="#111111" fill-opacity="0.62">Ensemble (equal weight)</tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">      </tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">         </tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">       </tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">   4.9% [2.6, 16.7]</tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62"> 7.1%</tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">         </tspan><tspan fill="#111111">   </tspan><tspan fill="#111111" fill-opacity="0.62">             </tspan></text>
<text class="l27" x="54.00" y="626.80"><tspan fill="#111111" fill-opacity="0.62">Linear: margins of Gerber, Beech-Nut taken from the logit calibration</tspan></text>
<text class="l28" x="54.00" y="645.65"><tspan fill="#111111" fill-opacity="0.62">PCAIDS: anchored on Heinz, own-price elasticity -4 (-1 divided by its Lerner margin of 25.0%), market elasticity -1</tspan></text>
