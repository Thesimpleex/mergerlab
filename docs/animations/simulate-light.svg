<text class="l0" x="54.00" y="117.85"><tspan fill="#111111" font-weight="700">mergerlab 0.1.0</tspan><tspan fill="#111111">  </tspan><tspan fill="#111111" font-weight="700">Heinz / Beech-Nut (illustrative)</tspan></text>
