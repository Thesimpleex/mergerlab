<text class="l5" x="54.00" y="212.10"><tspan fill="#111111">────────────────────────────────────────────────────────────────</tspan></text>
<text class="l6" x="54.00" y="230.95"><tspan fill="#111111">Gerber         Gerber       1.00           65.0%               -</tspan></text>
<text class="l7" x="54.00" y="249.80"><tspan fill="#111111">Heinz *        Heinz        1.00           17.4%           25.0%</tspan></text>
<text class="l8" x="54.00" y="268.65"><tspan fill="#111111">Beech-Nut *    Beech-Nut    1.00           15.4%               -</tspan></text>
<text class="l9" x="54.00" y="287.50"><tspan fill="#111111">Outside good                                2.2%                </tspan></text>
<text class="l10" x="54.00" y="306.35"></text>
