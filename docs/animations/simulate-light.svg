<text class="l19" x="54.00" y="476.00"><tspan fill="#111111" font-weight="700">Demand form            </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700"> Heinz</tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">Beech-Nut</tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">Average</tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">MC median [5%, 95%]</tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700"> CMCR</tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">Synergies</tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111"> </tspan><tspan fill="#111111" font-weight="700"> </tspan><tspan fill="#111111" font-weight="700">Consumer harm</tspan></text>
<text class="l20" x="54.00" y="494.85"><tspan fill="#111111">────────────────────────────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text class="l21" x="54.00" y="513.70"><tspan fill="#111111">Logit                      +4.8%       +5.4%   </tspan><tspan fill="#111111" font-weight="700">  +5.0%</tspan><tspan fill="#111111">       5.0% [3.2, 6.9]    8.0%      $17.4m          $32.2m</tspan></text>
<text class="l22" x="54.00" y="532.55"><tspan fill="#111111">Nested logit              +14.6%      +15.9%   </tspan><tspan fill="#111111" font-weight="700"> +15.2%</tspan><tspan fill="#111111">     11.8% [6.1, 23.2]   23.8%      $52.1m          $96.3m</tspan></text>
